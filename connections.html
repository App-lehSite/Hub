<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections Infinite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Libre Franklin', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        .nyt-serif {
            font-family: 'Playfair Display', Georgia, serif;
        }
        .nyt-sans {
            font-family: 'Libre Franklin', Arial, sans-serif;
        }
        
        /* Custom Premium Gameplay Animations */
        @keyframes rowSolve {
            0% { transform: scale(0.95); opacity: 0; }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes cardPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .animate-solve { animation: rowSolve 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pop { animation: cardPop 0.15s ease-out; }
        .animate-shake { animation: shake 0.25s ease-in-out; }
        
        /* Smooth scale transition for tiles */
        .grid-tile {
            transition: background-color 0.1s ease, color 0.1s ease, transform 0.1s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased select-none pb-8 bg-[#ffffff]">

    <header class="flex items-center justify-between px-6 py-4 border-b border-[#e2e2e2] max-w-xl w-full mx-auto bg-white">
        <div class="flex items-center">
            <a href="index.html" class="text-[11px] font-bold text-[#5a5a5c] hover:text-black transition flex items-center gap-1 border border-[#e2e2e2] rounded-full px-3 py-1.5 bg-[#fafafa] uppercase tracking-wider">
                &lt; Hub
            </a>
        </div>
        
        <h1 class="nyt-serif text-3xl font-black text-center tracking-tight text-[#000000]">Connections</h1>
        
        <div class="flex items-center gap-3">
            <button id="hint-btn" class="p-2 text-[#787878] hover:text-[#cca010] hover:bg-[#fafafa] rounded-full transition" title="Reveal Answers">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                    <path d="M12 22a2.99 2.99 0 0 1-2.822-2h5.644A2.99 2.99 0 0 1 12 22Zm3.42-4H8.58c-.51 0-.953-.33-1.1-.815l-.264-.847h9.567l-.263.847A1.157 1.157 0 0 1 15.42 18Zm.613-2.5H7.967l-.443-1.416A7.458 7.458 0 0 1 7 11.5a5 5 0 0 1 10 0c0 .914-.165 1.791-.466 2.584L16.033 15.5ZM12 4.5A7.008 7.008 0 0 0 5 11.5c0 1.545.5 2.974 1.348 4.144l.214.3H17.44l.214-.3A6.974 6.974 0 0 0 19 11.5 7.008 7.008 0 0 0 12 4.5Z" />
                </svg>
            </button>
            <button id="stats-btn" class="p-2 text-[#787878] hover:text-black hover:bg-[#fafafa] rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-start pt-8 px-4 max-w-xl w-full mx-auto gap-6">
        <div class="text-center">
            <p class="text-[#000000] text-[15px] font-medium tracking-wide">Create four groups of four!</p>
        </div>

        <div id="board-root" class="w-full flex flex-col gap-2">
            <div id="solved-rows-container" class="w-full flex flex-col gap-1.5"></div>
            <div id="active-cards-grid" class="grid grid-cols-4 gap-2 w-full mt-0.5"></div>
        </div>

        <div id="mistakes-container" class="flex items-center gap-3 text-[14px] text-black font-medium my-1">
            <span>Mistakes remaining:</span>
            <div id="dots-row" class="flex gap-2.5"></div>
        </div>

        <div class="w-full flex justify-center items-center gap-3 mt-1">
            <button id="shuffle-btn" class="border border-black hover:bg-[#f4f4f4] text-[14px] font-semibold rounded-full px-5 py-3.5 transition-all">
                Shuffle
            </button>
            <button id="deselect-btn" class="border border-black hover:bg-[#f4f4f4] text-[14px] font-semibold rounded-full px-5 py-3.5 transition-all">
                Deselect All
            </button>
            <button id="submit-btn" class="bg-white text-[#7f7f7f] border border-[#cccccc] text-[14px] font-bold rounded-full px-6 py-3.5 transition-all cursor-not-allowed" disabled>
                Submit
            </button>
        </div>
    </main>

    <div id="toast-container" class="fixed top-24 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <div id="stats-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 relative animate-solve text-center shadow-2xl border border-[#e2e2e2]">
            <button class="absolute top-4 right-4 text-[#787878] hover:text-black modal-close text-2xl font-light leading-none">&times;</button>
            <h2 class="nyt-serif text-2xl font-black mb-6 text-black">Statistics</h2>
            
            <div class="flex justify-around mb-6 border-b border-[#f0f0f0] pb-6">
                <div>
                    <div id="stat-played" class="text-3xl font-bold tracking-tight text-black">0</div>
                    <div class="text-[10px] text-[#787878] font-bold uppercase tracking-wider mt-1">Played</div>
                </div>
                <div>
                    <div id="stat-winpct" class="text-3xl font-bold tracking-tight text-black">0</div>
                    <div class="text-[10px] text-[#787878] font-bold uppercase tracking-wider mt-1">Win %</div>
                </div>
                <div>
                    <div id="stat-streak" class="text-3xl font-bold tracking-tight text-black">0</div>
                    <div class="text-[10px] text-[#787878] font-bold uppercase tracking-wider mt-1">Streak</div>
                </div>
            </div>

            <div id="game-over-controls" class="hidden pt-2">
                <p id="game-result-message" class="text-base font-bold mb-4"></p>
                <button id="play-again-btn" class="bg-black hover:bg-[#2c2c2c] transition font-bold text-white px-6 py-4 rounded-full text-xs uppercase tracking-widest w-full shadow-sm">
                    Play Next Board
                </button>
            </div>
        </div>
    </div>

                    { category: "Things found in a theater stage environment", level: "blue", words: ["PROP", "CURTAIN", "LIGHTS", "SCRIPT"] },

                ]
            },

                groups: [
                    { category: "Fastener types", level: "yellow", words: ["NAIL", "SCREW", "BOLT", "RIVET"] },
                    { category: "Places of financial safekeeping", level: "green", words: ["BANK", "VAULT", "SAFE", "COFFER"] },
                    { category: "Things with handles", level: "blue", words: ["MUG", "BROOM", "SUITCASE", "DRAWER"] },
                    { category: "Words containing astronomical components", level: "purple", words: ["SUNDAY", "MOONLIGHT", "EARTHQUAKE", "STARFISH"] }
                ]
            },
            {
                id: 15,
                groups: [
                    { category: "Fluid storage structures", level: "yellow", words: ["TANK", "POOL", "BARREL", "JUG"] },
                    { category: "Parts of a complete tree architecture", level: "green", words: ["ROOT", "BARK", "BRANCH", "LEAF"] },
                    { category: "Terms referring to standard music releases", level: "blue", words: ["ALBUM", "SINGLE", "TRACK", "RECORD"] },
                    { category: "Words that rhyme with dynamic colors", level: "purple", words: ["BED", "FEW", "BEAN", "GOWN"] }
                ]
            }
        ];

        // Official NYT Color Specification Matrix (Cleaned & Calibrated)
        const levelStyles = {
            yellow: { bg: "bg-[#f9df6d]", text: "text-[#000000]" },
            green: { bg: "bg-[#a0c35a]", text: "text-[#000000]" },
            blue: { bg: "bg-[#b0c4ef]", text: "text-[#000000]" },
            purple: { bg: "bg-[#ba7ec8]", text: "text-[#ffffff]" }
        };

        let currentPuzzle = {};
        let unplacedCards = []; 
        let selectedCards = [];  
        let resolvedGroups = []; 
        let mistakesRemaining = 4;
        let isGameFinished = false;
        let stats = { played: 0, won: 0, streak: 0 };

        // DOM Framework Nodes Injections
        const solvedRowsContainer = document.getElementById("solved-rows-container");
        const activeCardsGrid = document.getElementById("active-cards-grid");
        const dotsRow = document.getElementById("dots-row");
        const submitBtn = document.getElementById("submit-btn");
        const deselectBtn = document.getElementById("deselect-btn");
        const shuffleBtn = document.getElementById("shuffle-btn");
        const statsModal = document.getElementById("stats-modal");
        const gameOverControls = document.getElementById("game-over-controls");
        const gameResultMessage = document.getElementById("game-result-message");
        const toastContainer = document.getElementById("toast-container");

        function initApp() {
            loadStats();
            setupNewGameSession();
            
            document.getElementById("stats-btn").onclick = () => showStatsModal();
            document.querySelector(".modal-close").onclick = () => statsModal.classList.add("hidden");
            document.getElementById("play-again-btn").onclick = () => setupNewGameSession();
            
            shuffleBtn.onclick = () => shuffleActiveDeck();
            deselectBtn.onclick = () => clearActiveSelections();
            submitBtn.onclick = () => evaluateSubmissionAttempt();
            document.getElementById("hint-btn").onclick = () => revealCheatAnswers();
        }

        function setupNewGameSession() {
            statsModal.classList.add("hidden");
            gameOverControls.classList.add("hidden");
            solvedRowsContainer.innerHTML = ""; 
            
            const randIdx = Math.floor(Math.random() * puzzleBank.length);
            currentPuzzle = puzzleBank[randIdx];

            unplacedCards = [];
            selectedCards = [];
            resolvedGroups = [];
            mistakesRemaining = 4;
            isGameFinished = false;

            currentPuzzle.groups.forEach(g => {
                g.words.forEach(w => {
                    unplacedCards.push({ word: w, category: g.category, level: g.level });
                });
            });

            scrambleArray(unplacedCards);
            renderActiveGridOnly();
            renderMistakeDots();
            refreshInterfaceControls();
        }

        function renderActiveGridOnly() {
            activeCardsGrid.innerHTML = "";

            if (unplacedCards.length > 0) {
                unplacedCards.forEach(card => {
                    const isSelected = selectedCards.includes(card.word);
                    const btn = document.createElement("button");
                    
                    btn.className = `grid-tile nyt-sans aspect-[4/2.8] p-1 flex items-center justify-center text-center text-xs sm:text-[14px] font-bold uppercase rounded-[6px] tracking-wide select-none ${
                        isSelected 
                        ? 'bg-[#5a5a5c] text-white' 
                        : 'bg-[#efefe6] text-[#000000] hover:bg-[#e4e4db]'
                    }`;
                    btn.innerText = card.word;
                    btn.onclick = (e) => handleCardInteraction(card.word, e);
                    activeCardsGrid.appendChild(btn);
                });
            }
        }

        function renderMistakeDots() {
            dotsRow.innerHTML = "";
            for (let i = 0; i < 4; i++) {
                const circle = document.createElement("div");
                circle.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${i < mistakesRemaining ? 'bg-[#000000]' : 'bg-[#e6e6e6]'}`;
                dotsRow.appendChild(circle);
            }
        }

        function appendSolvedRowToTop(g) {
            const row = document.createElement("div");
            const style = levelStyles[g.level];
            
            row.className = `${style.bg} ${style.text} w-full rounded-[6px] py-4 px-2 text-center animate-solve flex flex-col justify-center items-center my-0.5 shadow-xs`;
            
            const label = document.createElement("div");
            label.className = "text-[11px] font-bold uppercase tracking-widest opacity-80 mb-0.5 nyt-sans";
            label.innerText = g.category;

            const textSpan = document.createElement("div");
            textSpan.className = "text-sm sm:text-[15px] font-extrabold tracking-wide uppercase";
            textSpan.innerText = g.words.join(", ");

            row.appendChild(label);
            row.appendChild(textSpan);
            solvedRowsContainer.appendChild(row);
        }

        function refreshInterfaceControls() {
            if (selectedCards.length === 4 && !isGameFinished) {
                submitBtn.removeAttribute("disabled");
                submitBtn.className = "bg-black text-white border border-black text-[14px] font-semibold rounded-full px-6 py-3.5 transition-all cursor-pointer hover:bg-[#2c2c2c] active:scale-95";
            } else {
                submitBtn.setAttribute("disabled", "true");
                submitBtn.className = "bg-white text-[#7f7f7f] border border-[#cccccc] text-[14px] font-semibold rounded-full px-6 py-3.5 transition-all cursor-not-allowed";
            }

            if (isGameFinished) {
                shuffleBtn.setAttribute("disabled", "true");
                deselectBtn.setAttribute("disabled", "true");
                shuffleBtn.className = "opacity-30 border border-[#ccc] text-[14px] font-semibold rounded-full px-5 py-3.5 cursor-not-allowed";
                deselectBtn.className = "opacity-30 border border-[#ccc] text-[14px] font-semibold rounded-full px-5 py-3.5 cursor-not-allowed";
            } else {
                shuffleBtn.removeAttribute("disabled");
                deselectBtn.removeAttribute("disabled");
                shuffleBtn.className = "border border-black hover:bg-[#f4f4f4] text-[14px] font-semibold rounded-full px-5 py-3.5 transition active:scale-95";
                deselectBtn.className = "border border-black hover:bg-[#f4f4f4] text-[14px] font-semibold rounded-full px-5 py-3.5 transition active:scale-95";
            }
        }

        function handleCardInteraction(word, event) {
            if (isGameFinished) return;

            const index = selectedCards.indexOf(word);
            if (index > -1) {
                selectedCards.splice(index, 1);
            } else {
                if (selectedCards.length >= 4) return;
                selectedCards.push(word);
                event.target.classList.add("animate-pop");
            }

            renderActiveGridOnly();
            refreshInterfaceControls();
        }

        function clearActiveSelections() {
            if (isGameFinished) return;
            selectedCards = [];
            renderActiveGridOnly();
            refreshInterfaceControls();
        }

        function shuffleActiveDeck() {
            if (isGameFinished) return;
            scrambleArray(unplacedCards);
            renderActiveGridOnly();
        }

        function evaluateSubmissionAttempt() {
            if (selectedCards.length !== 4 || isGameFinished) return;

            const matchedMeta = unplacedCards.filter(c => selectedCards.includes(c.word));
            const distinctCategories = [...new Set(matchedMeta.map(m => m.category))];

            if (distinctCategories.length === 1) {
                const matchedCategoryName = distinctCategories[0];
                const targetGroupSource = currentPuzzle.groups.find(g => g.category === matchedCategoryName);

                resolvedGroups.push(targetGroupSource);
                unplacedCards = unplacedCards.filter(c => !selectedCards.includes(c.word));
                selectedCards = [];

                appendSolvedRowToTop(targetGroupSource);
                renderActiveGridOnly();
                refreshInterfaceControls();

                if (unplacedCards.length === 0) {
                    executeGameClosure(true);
                }
            } else {
                triggerShakeAnimation();
                mistakesRemaining--;
                
                let closeCall = false;
                currentPuzzle.groups.forEach(g => {
                    const intersectCount = g.words.filter(w => selectedCards.includes(w)).length;
                    if (intersectCount === 3) closeCall = true;
                });

                renderActiveGridOnly();
                renderMistakeDots();
                refreshInterfaceControls();

                if (closeCall && mistakesRemaining > 0) {
                    showToast("One away...");
                }

                if (mistakesRemaining === 0) {
                    executeGameClosure(false);
                }
            }
        }

        function executeGameClosure(isWin) {
            isGameFinished = true;
            saveStats(isWin);
            refreshInterfaceControls();

            setTimeout(() => {
                if (isWin) {
                    gameResultMessage.innerText = "Fantastic!";
                    gameResultMessage.className = "nyt-serif text-xl font-bold text-black";
                } else {
                    gameResultMessage.innerText = "Next time!";
                    gameResultMessage.className = "nyt-serif text-xl font-bold text-[#787878]";
                    resolveRemainingGroupsAutomatically();
                }
                showStatsModal();
            }, 1000);
        }

        function resolveRemainingGroupsAutomatically() {
            currentPuzzle.groups.forEach(g => {
                if (!resolvedGroups.some(rg => rg.category === g.category)) {
                    appendSolvedRowToTop(g);
                }
            });
            unplacedCards = [];
            selectedCards = [];
            renderActiveGridOnly();
        }

        function revealCheatAnswers() {
            if (isGameFinished) {
                showToast("Game session ended.");
                return;
            }
            let solutionsOutput = "<div class='nyt-sans text-xs font-bold text-[#b5b5b5] mb-2 tracking-wider uppercase border-b border-zinc-700 pb-1'>Answers Matrix</div>";
            currentPuzzle.groups.forEach(g => {
                solutionsOutput += `<div class='text-xs text-left py-0.5 text-zinc-300'><span class='font-bold text-white'>${g.category}</span>: ${g.words.join(', ')}</div>`;
            });
            showToast(solutionsOutput, 5000);
        }

        function scrambleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function triggerShakeAnimation() {
            activeCardsGrid.classList.add("animate-shake");
            activeCardsGrid.addEventListener("animationend", () => activeCardsGrid.classList.remove("animate-shake"), { once: true });
        }

        function showToast(message, duration = 2500) {
            const toast = document.createElement("div");
            toast.className = "bg-[#121212] text-white text-xs sm:text-sm font-semibold px-5 py-3 rounded-lg shadow-2xl transition-opacity duration-200 opacity-0 text-center max-w-sm border border-zinc-800";
            toast.innerHTML = message;
            toastContainer.appendChild(toast);

            requestAnimationFrame(() => toast.classList.add("opacity-100"));
            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.addEventListener("transitionend", () => toast.remove());
            }, duration);
        }

        function loadStats() {
            const raw = localStorage.getItem("connections_infinite_stats");
            if (raw) {
                stats = JSON.parse(raw);
            } else {
                stats = { played: 0, won: 0, streak: 0 };
            }
        }

        function saveStats(isWin) {
            stats.played++;
            if (isWin) {
                stats.won++;
                stats.streak++;
            } else {
                stats.streak = 0;
            }
            localStorage.setItem("connections_infinite_stats", JSON.stringify(stats));
        }

        function showStatsModal() {
            document.getElementById("stat-played").innerText = stats.played;
            const winPct = stats.played > 0 ? Math.round((stats.won / stats.played) * 100) : 0;
            document.getElementById("stat-winpct").innerText = winPct + "%";
            document.getElementById("stat-streak").innerText = stats.streak;

            if (isGameFinished) gameOverControls.classList.remove("hidden");
            else gameOverControls.classList.add("hidden");

            statsModal.classList.remove("hidden");
        }

        window.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
